name: Bot de Indexa

on:
  schedule:
    # Lunes a viernes, 16:17 UTC (18:17 en Madrid en verano, 17:17 en invierno)
    - cron: "17 16 * * 1-5"
  workflow_dispatch:
    inputs:
      modo:
        description: "¿Qué quieres hacer?"
        default: "Probar el bot"
        type: choice
        options:
          - "Probar el bot"
          - "Mandar el resumen ahora"

permissions:
  contents: write   # para guardar state.json (memoria del bot)

concurrency:
  group: indexa-bot
  cancel-in-progress: false

jobs:
  bot:
    name: Bot de Indexa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          INDEXA_TOKEN: ${{ secrets.INDEXA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UMBRALES_CAIDA: ${{ vars.UMBRALES_CAIDA }}
          RECUPERACION: ${{ vars.RECUPERACION }}
          DIA_RESUMEN: ${{ vars.DIA_RESUMEN }}
          AVISO_OPERACIONES: ${{ vars.AVISO_OPERACIONES }}
          MODO: ${{ inputs.modo }}
        run: |
          case "$MODO" in
            "Probar el bot")           python bot.py --test ;;
            "Mandar el resumen ahora") python bot.py --summary ;;
            *)                         python bot.py ;;
          esac

      - name: Guardar memoria del bot
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "indexa-bot"
          git config user.email "indexa-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: actualizar memoria"
            git push
          fi
